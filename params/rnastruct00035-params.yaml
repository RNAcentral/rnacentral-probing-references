# rnastruct00035: Saccharomyces cerevisiae, yeast small-RNA transcriptome route; rRNA-depleted (curated mRNA) but kept in release 28 for the paper, scored on its residual rRNA; the genome-route params are in git history
# status: run on the transcriptome 2026-11-02 with the resequencing run concatenated into replicate 2; passes the QC gate
rnacentral: true
structextract: true

transcriptome: true
fasta: /hps/nobackup/agb/rnacentral/chemicalprob/rnacentral-probing-references/release28/saccharomyces_cerevisiae/reference/saccharomyces_cerevisiae.small_rna.transcriptome.fa
# best alignment only: with -a, reads also land on near-identical copies and their differences count as mutations
bowtie_all: false
# reads from mRNAs and longer RNAs have nowhere to map on an ncRNA-only reference, so mapped % measures the library; gate on read depth as for viral genomes
rnacentral_gate_on_depth: true

rfeval_reference: /hps/nobackup/agb/rnacentral/chemicalprob/rnacentral-probing-references/release28/saccharomyces_cerevisiae/rfeval/small_rna.db
rfeval_windows:   /hps/nobackup/agb/rnacentral/chemicalprob/rnacentral-probing-references/release28/saccharomyces_cerevisiae/rfeval/small_rna.windows.tsv
