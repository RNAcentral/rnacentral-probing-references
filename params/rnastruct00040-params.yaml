# rnastruct00040: Homo sapiens, small-RNA transcriptome route (size-selected library); the genome-route params are in git history
# status: draft (the tRNA + rRNA test fixed the tRNA and in vivo rf-eval failures; now on the full small-RNA reference)
# QC gate off until the mapped % on the full reference has been checked
rnacentral: false
structextract: true

transcriptome: true
fasta: /hps/nobackup/agb/rnacentral/chemicalprob/rnacentral-probing-references/release28/homo_sapiens/reference/homo_sapiens.small_rna.transcriptome.fa
# best alignment only: with -a, reads also land on near-identical copies and their differences count as mutations
bowtie_all: false
rfcount_map_max_coverage: 20000

rfeval_reference: /hps/nobackup/agb/rnacentral/chemicalprob/rnacentral-probing-references/release28/homo_sapiens/rfeval/small_rna.db
rfeval_windows:   /hps/nobackup/agb/rnacentral/chemicalprob/rnacentral-probing-references/release28/homo_sapiens/rfeval/small_rna.windows.tsv
