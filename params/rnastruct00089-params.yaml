# rnastruct00089: Homo sapiens, Ensembl route (poly(A) mRNA; the RNAcentral GTF has only ncRNAs, so it would leave almost nothing to count)
# status: draft (generated from the metadata; not yet run)
rnacentral: true
structextract: true
# as for rnastruct00088: count only transcripts deep enough for reactivities, so rf-count does not run one samtools call per covered Ensembl transcript
rfcount_min_reads: 1000

# no gtf or fasta: the pipeline downloads the Ensembl genome and GTF for the samplesheet organism
# no rf-eval: rrna_common is keyed on RNAcentral GTF transcripts, and poly(A) libraries carry little rRNA
