# rnastruct00038: Homo sapiens, Ensembl route (rRNA-depleted, poly(A) RNA; the RNAcentral-GTF route failed replicate correlation over thinly covered transcripts, and its params are in git history)
# status: draft (not yet run on the Ensembl route)
rnacentral: true
structextract: true
# count only transcripts deep enough for reactivities, as for the other Ensembl-route datasets
rfcount_min_reads: 1000

# no gtf or fasta: the pipeline downloads the Ensembl genome and GTF for the samplesheet organism
# no rf-eval: rrna_common is keyed on RNAcentral GTF transcripts, and the library is rRNA-depleted
