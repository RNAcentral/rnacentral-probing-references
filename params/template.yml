# <dataset_id>: <organism> [<strain>], <genome|transcriptome> route
# Copy to params/<dataset_id>.yml and keep one block of reference options below.
# Paths point into this repo's checkout on codon; only the release<N>/ segment
# changes between RNAcentral releases.

rnacentral: true      # fail-fast QC gate
structextract: true

# Human, mouse, yeast, rice: genome route. Give the RNAcentral GTF only; the
# pipeline downloads the Ensembl genome for the samplesheet's organism.
gtf: /hps/nobackup/agb/rnacentral/chemicalprob/rnacentral-probing-references/release27/human/reference/homo_sapiens.GRCh38.filtered.gtf.gz

# E. coli and viruses: transcriptome route with the <stem>.transcriptome.fa for
# the dataset's strain, and no gtf.
# transcriptome: true
# fasta: /hps/nobackup/agb/rnacentral/chemicalprob/rnacentral-probing-references/release27/ecoli/reference/ECOLI_MG1655.transcriptome.fa

# Organisms with no reference here: leave out gtf and fasta, and the pipeline
# downloads the Ensembl/NCBI reference for the samplesheet's organism.

# Optional: rf-eval, for organisms with an rfeval/ folder.
rfeval_reference: /hps/nobackup/agb/rnacentral/chemicalprob/rnacentral-probing-references/release27/human/rfeval/rrna_common.db
rfeval_windows:   /hps/nobackup/agb/rnacentral/chemicalprob/rnacentral-probing-references/release27/human/rfeval/rrna_common.windows.tsv

# Dataset-specific options (adapters, trimming, normalisation) go here.
