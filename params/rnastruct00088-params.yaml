# rnastruct00088: Homo sapiens, Ensembl route (targeted mRNAs; the RNAcentral GTF has only ncRNAs, so it would leave almost nothing to count)
# status: draft (generated from the metadata; not yet run)
rnacentral: true
structextract: true
# rf-count counts transcripts with at least 1000 reads, the pipeline's MaP coverage threshold for rf-norm and rf-normfactor: 16.6k of the 390k Ensembl transcripts with reads

# no gtf or fasta: the pipeline downloads the Ensembl genome and GTF for the samplesheet organism
# no rf-eval: rrna_common is keyed on RNAcentral GTF transcripts, and the targeted genes include no rRNA
